# fly.toml app configuration file generated for reflex-card-game-backend on 2026-04-08T22:41:07+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reflex-card-game-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CARD_INTERVAL_MS = '1500'
  PORT = '8080'
  ROUNDS_TO_WIN = '3'
  FRONTEND_ORIGIN = 'https://reflex-card-game.vercel.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
